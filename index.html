
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Digital Clock</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000000;
    font-family: Arial, sans-serif;
    color: white;
}

.clock-container {
    width: 90%;
    max-width: 600px;
    padding: 55px 25px;
    text-align: center;
    background: #111111;
    border: 1px solid #333333;
    border-radius: 25px;
    box-shadow: 0 15px 50px rgba(255,255,255,0.08);
}

.title {
    font-size: 15px;
    letter-spacing: 6px;
    color: #999999;
    margin-bottom: 35px;
}

.time {
    font-size: clamp(48px, 12vw, 85px);
    font-weight: bold;
    letter-spacing: 3px;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
}

.date {
    margin-top: 25px;
    font-size: 17px;
    color: #aaaaaa;
}

.status {
    margin-top: 35px;
    display: inline-block;
    padding: 10px 25px;
    border: 1px solid #555555;
    border-radius: 30px;
    color: white;
    font-size: 12px;
    letter-spacing: 3px;
}

.footer {
    margin-top: 35px;
    color: #666666;
    font-size: 12px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="clock-container">

    <div class="title">DIGITAL CLOCK</div>

    <div class="time" id="clock">00:00:00</div>

    <div class="date" id="date"></div>

    <div class="status">● LIVE CLOCK</div>

    <div class="footer">
        MODERN BLACK & WHITE DESIGN
    </div>

</div>

<script>
function updateClock() {

    const now = new Date();

    const time = now.toLocaleTimeString('de-DE', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
    });

    const date = now.toLocaleDateString('de-DE', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });

    document.getElementById('clock').textContent = time;
    document.getElementById('date').textContent = date;
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
